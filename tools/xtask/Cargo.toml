[package]
name = "xtask"
description = "Workflow automation: runs multi-command workflows and distills their output."
version.workspace = true
edition.workspace = true
license.workspace = true
# A maintenance tool of this repository, never published.
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
# The manifest's file name, so the root finder spells it in one place, the core's constant.
knowledge-architect = { path = "../../crates/core" }
# The gates' runner, which this repository publishes for other projects and uses itself.
knowledge-architect-gates = { path = "../../crates/gates" }

[dev-dependencies]
# `cargo metadata`'s output, which the checkout test reads for the workspace's targets.
serde_json = "1"
