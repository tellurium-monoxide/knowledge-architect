[package]
name = "knowledge"
description = "What a project's documents hold, and whether it still holds: the walk, the entity table, references, registers and generated indexes."
version.workspace = true
edition.workspace = true
publish.workspace = true

# See the note in `../rules-corpus/rules/Cargo.toml` on why tool dependencies are not in the
# workspace dependency table.
[dependencies]
documentation = { path = "documentation" }
clap = { version = "4", features = ["derive"] }
