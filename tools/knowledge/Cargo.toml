[package]
name = "knowledge"
description = "What a project's documents hold, and whether it still holds: the walk, the entity table, references, registers and generated indexes."
version.workspace = true
edition.workspace = true
publish.workspace = true

# Tool dependencies are declared here rather than in `[workspace.dependencies]`, so that
# the workspace manifest keeps describing what the shipped crates depend on and nothing
# else.
[dependencies]
documentation = { path = "documentation" }
clap = { version = "4", features = ["derive"] }
