[package]
name = "documentation"
description = "This repository's own documents: the walk, the model, and every check over it."
version.workspace = true
edition.workspace = true
publish.workspace = true

# See the note in `../rules/Cargo.toml` on why tool dependencies are not in the workspace
# dependency table.
[dependencies]
regex = "1.13.1"
rules = { path = "../rules" }
serde = { workspace = true, features = ["derive"] }
toml = "1.1.4"
