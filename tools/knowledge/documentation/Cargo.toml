[package]
name = "documentation"
description = "This repository's own documents: the walk, the model, and every check over it."
version.workspace = true
edition.workspace = true
publish.workspace = true

# See the note in `../rules/Cargo.toml` on why tool dependencies are not in the workspace
# dependency table.
[dependencies]
# The core's commands are a library module, so a binary that registers an extension flattens
# them into its own, per `design@knowledge@the-core-cli-is-a-library-module`.
clap = { version = "4", features = ["derive"] }
# The two parsers. A Rust doc comment's content is markdown, so the markdown parser runs over
# both file kinds and the Rust grammar's job is to say which byte ranges are prose at all.
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.13.1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
rules = { path = "../rules" }
serde = { workspace = true, features = ["derive"] }
toml = "1.1.4"

[features]
# Exposes the helpers an integration test needs to build a manifest variant in memory.
testing = []
