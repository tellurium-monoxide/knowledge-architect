[package]
name = "rules"
description = "The Comprehensive Rules corpus: parse, pin, archive, resolve, diff, watch."
version.workspace = true
edition.workspace = true
publish.workspace = true

# Tool dependencies are declared here rather than in `[workspace.dependencies]`, so that
# the workspace manifest keeps describing what the shipped crates depend on and nothing
# else.
[dependencies]
regex = "1.13.1"
sha2 = "0.11.0"
unicode-normalization = "0.1.25"
