# A mock project whose documents are wrong on purpose. Every defect below is one the checker
# must find; a test asserts the findings themselves, not merely that something failed.


[project]
name = "planted"
# One component below the root, carrying every document but one.
components = ["parts/widget"]

# PLANTED: a location whose issue directory is not there. A location carries the registers it
# declares, so the missing home is a finding against the location rather than a silent gap.
[locations.agent-config]
path = "agent-config"
registers = ["issue"]

[walk]
# Not a git repository, so there is no `.git` to skip and none is declared.
skip-dirs = []
# The rules text is not a citation of itself.
skip-files = ["corpus/CompRules.txt"]
exclude = []

[lint]
# PLANTED: `notes/gone.md` is not there. An exemption naming a file that does not exist is the
# stale row this check reports — silent otherwise, and inherited by whatever is created there.
exempt-files = ["notes/exempt.md", "notes/gone.md"]

[rules]
dir = "corpus"
text = "CompRules.txt"
body-starts-at = 0
version = "VERSION"
past = "past"
manifest = "past/MANIFEST.tsv"
