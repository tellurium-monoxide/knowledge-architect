# WHAT THIS MOCK EXERCISES: conformance. Every one of the eight families runs over it and
# finds nothing, which is the assertion `planted` cannot make. It carries the directory shape
# of a heading home — `docs/design/` and `docs/goals/`, each headed by a README linking its
# subdocument — the only ISSUE instance in any mock that declares a group, a changelog and an
# archive-free corpus so `changes` and `corpus` are not gated off, and every generated file
# committed and current. Plant no defect here: this is the project that shows the checks do
# not report over a tree that is right.

[project]
name = "dirhome"
components = []

[walk]
skip-dirs = []
# The rules text is not a citation of itself; the changelog pins its own release per section;
# and the rule index is generated. No row names a file-register index: the tool derives that
# set from the register instances, so those are outside the walk by construction.
skip-files = ["corpus/CompRules.txt", "corpus/CHANGES.md"]
exclude = []

[lint]
exempt-files = []

[rules]
dir = "corpus"
text = "CompRules.txt"
body-starts-at = 0
version = "VERSION"
past = "past"
manifest = "past/MANIFEST.tsv"
