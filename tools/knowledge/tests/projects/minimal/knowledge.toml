# A mock project. Its layout differs from the repository that holds it on purpose: the rules
# corpus is `corpus/` rather than `docs/rules/`, its text has another name, and its body
# starts on the first line. Anything the tool gets right here it gets right from this file
# rather than from a constant.

[project]
name = "minimal"
components = []

# `notes/` carries outstanding state and a register of its own, and nothing else a component
# carries. A location gives it an anchor, so its entries can be cited.
[locations.notes]
path = "notes"
registers = ["issue", "reading"]

# A register nothing compiles in: this project declares it, and the tool learns the kind
# `reading` from this table alone.
[registers.reading]
scope = "opt-in"
shape = "file"
dir = "readings"
sections = ["Rules", "Reading", "Consequences"]

[registers.reading.metadata.status]
values = ["settled", "ambiguous"]

[walk]
skip-dirs = ["build"]
skip-files = ["notes/generated.md"]
exclude = ["vendor"]

[lint]
# Nothing here is exempt. The row named `notes/stale.md`, a file this project has never had,
# and nothing exercised it; the exemption path is covered by `planted`, which has a file to
# exempt and a test that it is not linted. Found when the check that every declared path
# exists was written, which is the defect that check exists for.
exempt-files = []

[rules]
dir = "corpus"
text = "CompRules.txt"
body-starts-at = 0
version = "VERSION"
past = "past"
manifest = "past/MANIFEST.tsv"
