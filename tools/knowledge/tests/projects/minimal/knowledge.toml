# WHAT THIS MOCK EXERCISES: the walk and the anchors that are not components. It declares a
# location, `notes/`, and two registers nothing compiles in, one of each shape: `reading`, a
# file register whose instance is grouped by a `register.toml`, and `note`, a heading register.
# It exercises all three exclusion kinds, both single-file heading-home shapes, and three
# file-register instances at once. It deliberately carries no rule index, so a test of `index`
# can watch a generated file be created. Its layout differs from the repository that holds it
# on purpose: the rules corpus is `corpus/` rather than `docs/rules/`, its text has another
# name, and its body starts on the first line. Anything the tool gets right here it gets right
# from this file rather than from a constant.

[project]
name = "minimal"
components = []

# `notes/` carries outstanding state and a register of its own, and nothing else a component
# carries. A location gives it an anchor, so its entries can be cited.
[locations.notes]
path = "notes"
registers = ["issue", "reading", "note"]

# A register nothing compiles in: this project declares it, and the tool learns the kind
# `reading` from this table alone.
[registers.reading]
scope = "opt-in"
shape = "file"
dir = "readings"
sections = ["Rules", "Reading", "Consequences"]

[registers.reading.metadata.status]
values = ["settled", "ambiguous"]

# The other shape a declared register may take. Nothing compiles this one in either, and it is
# the only heading-shaped DECLARED register in any mock project: without it the heading shape is
# exercised by the built-in three alone, whose homes the tool knows without reading a manifest.
[registers.note]
scope = "opt-in"
shape = "heading"
dir = "decisions"

[walk]
skip-dirs = ["build"]
# The rules text is not a citation of itself. No row names the rule index: this project does
# not carry one, which is what lets a test of `index` watch a generated file be created.
skip-files = ["notes/generated.md", "corpus/CompRules.txt"]
exclude = ["vendor"]

[lint]
# Nothing here is exempt. The row named `notes/stale.md`, a file this project has never had,
# and nothing exercised it; the exemption path is covered by `planted`, which has a file to
# exempt and a test that it is not linted. Found when the check that every declared path
# exists was written, which is the defect that check exists for.
exempt-files = []

[rules]
dir = "corpus"
text = "CompRules.txt"
body-starts-at = 0
version = "VERSION"
past = "past"
manifest = "past/MANIFEST.tsv"
