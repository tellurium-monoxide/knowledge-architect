# WHAT THIS MOCK EXERCISES: release resolution. Its one document pins a release that is
# neither vendored nor archived, and resolving that pin is the only thing in any mock that can
# reach the network — so this project separates the families that read rule text from the
# families that do not: a run asking for references must succeed without touching it, and a run
# asking for citations must fail on it. Everything else here is conformant, so a finding from
# another family is a defect rather than a fixture.

[project]
name = "pinned"
components = []

[walk]
# Git never lists its own directory, so the walk never reaches it and no row names it.
skip-dirs = []
skip-files = ["corpus/CompRules.txt"]
exclude = []

[rules]
dir = "corpus"
text = "CompRules.txt"
body-starts-at = 0
version = "VERSION"
past = "past"
manifest = "past/MANIFEST.tsv"
