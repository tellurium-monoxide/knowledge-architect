# WHAT THIS MOCK EXERCISES: the release's own typography. Its corpus carries a curly
# apostrophe that a comparison folds, and what `rules show` prints must carry the release's
# form rather than the folded one, because a caller pastes that line into a document. It is
# also the smallest conformant component: one file per heading home, an empty issue register,
# and nothing else. Its layout differs from the repository that holds it on purpose: the rules
# corpus is `corpus/` rather than `docs/rules/`, its text has another name, and its body starts
# on the first line.

[project]
name = "typography"
components = []

[walk]
skip-dirs = []
# The rules text is not a citation of itself, and the rule index is generated.
skip-files = ["corpus/CompRules.txt"]
exclude = []

[rules]
# Nothing here is exempt. The row named `notes/stale.md`, a file this project has never had,
# and nothing exercised it; the exemption path is covered by `planted`, which has a file to
# exempt and a test that it is not linted. Found when the check that every declared path
# exists was written, which is the defect that check exists for.
exempt-files = []
dir = "corpus"
text = "CompRules.txt"
body-starts-at = 0
version = "VERSION"
past = "past"
manifest = "past/MANIFEST.tsv"
