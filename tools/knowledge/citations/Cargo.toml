[package]
name = "citations"
description = "The rules extension of the knowledge core: rule quotes verified against a pinned corpus."
version.workspace = true
edition.workspace = true
publish.workspace = true

# See the note in `../rules/Cargo.toml` on why tool dependencies are not in the workspace
# dependency table.
[dependencies]
documentation = { path = "../documentation" }
rules = { path = "../rules" }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.13.1"
serde = { workspace = true, features = ["derive"] }
toml = "1.1.4"
