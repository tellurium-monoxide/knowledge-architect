[package]
name = "knowledge-architect"
description = "Keeps the design record of a project's documentation consistent with its code: the walk, the entity table, references, registers and generated indexes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
# What the published package ships, as a whitelist: a new directory is shipped only once it is
# listed here, so the test fixtures and the design documents never reach the package.
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

# The library is imported as `knowledge_architect`; the binary is `klarch`, short to type, as the
# default command a project runs.
[lib]
path = "src/lib.rs"

[[bin]]
name = "klarch"
path = "src/main.rs"

[dependencies]
# The core's commands are a library module, so a binary that registers an extension flattens
# them into its own, per `design@core@the-core-cli-is-a-library-module`.
clap = { version = "4", features = ["derive"] }
# The two parsers. A Rust doc comment's content is markdown, so the markdown parser runs over
# both file kinds and the Rust grammar's job is to say which byte ranges are prose at all.
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.13.1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
serde = { version = "1", features = ["derive"] }
toml = "1.1.4"
knowledge-architect-agent-skills = { path = "../agent-skills", version = "=0.0.0" }
