# WHAT THIS MOCK EXERCISES, for the core binary: the walk and the anchors that are not
# components. It declares a location, `notes/`, and two registers nothing compiles in, one of
# each shape: `reading`, a file register whose instance is grouped by a `register.toml`, and
# `note`, a heading register. It exercises all three exclusion kinds, both single-file
# heading-home shapes, and three file-register instances at once. It declares no table the core
# does not own.

[project]
# A mock project inside the core's directory, which the binary built here confirms.
checker-version = "fixture"
name = "minimal"
components = []

# `notes/` carries outstanding state and a register of its own, and nothing else a component
# carries. A location gives it an anchor, so its entries can be cited.
[locations.notes]
path = "notes"
registers = ["issue", "reading", "note"]

# A register nothing compiles in: this project declares it, and the tool learns the kind
# `reading` from this table alone.
[registers.reading]
scope = "opt-in"
shape = "file"
dir = "readings"
sections = ["Rules", "Reading", "Consequences"]

[registers.reading.metadata.status]
values = ["settled", "ambiguous"]

# The other shape a declared register may take. Nothing compiles this one in either, and it is
# the only heading-shaped DECLARED register in any mock project: without it the heading shape is
# exercised by the built-in three alone, whose homes the tool knows without reading a manifest.
[registers.note]
scope = "opt-in"
shape = "heading"
dir = "decisions"
level = 2

[walk]
skip-dirs = ["build"]
# No row names a file-register index: the tool derives every generated file from this manifest.
skip-files = ["notes/generated.md"]
exclude = ["vendor"]

# This mock installs nothing. The shipped set changes with every version of the skills, and a
# fixture that held its installed copy would change with them.
[agents]
harness = []
