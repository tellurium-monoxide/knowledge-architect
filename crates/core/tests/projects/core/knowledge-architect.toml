# The smallest conformant project for the core binary, with no extension: it declares no table
# the core does not own, and it carries every document the root component owes. The core binary
# passes over it; a copy that adds a `[rules]` table is refused, because no extension of that
# binary claims it.

[project]
name = "core-mock"
components = []

[walk]
skip-dirs = []
skip-files = []

# This mock installs nothing. The shipped set changes with every version of the skills, and a
# fixture that held its installed copy would change with them.
[agents]
harness = []
