# WHAT THIS MOCK EXERCISES, for the core binary: the phase gate. It carries one planted defect
# per assertion of the first phases that read the tree — a declared path that is not there, a
# missing heading home, the retired file shape of a file register, a location whose home is
# absent, a file the walk cannot read as text — and, behind them, the definition-site defects
# of the entity table: a slug defined twice, one at a level its register does not declare, one
# at the head of a plain line, one in a table cell, one outside every register home, one in the
# middle of a line, a heading at its register's level with no slug, and an entry id no reference
# can spell. A run over it stops at phase 2 and prints those findings
# alone; the tests in `path@knowledge@tests/mock_projects.rs` reach the phase-3 defects by
# calling the entity table directly. The phase-4 defects, one per check, are `planted`'s, which is
# clean through phase 3 for exactly that reason.

[project]
name = "unsound"
components = ["parts/widget"]

# PLANTED: a location whose issue directory is not there. A location carries the registers it
# declares, so the missing home is a finding against the location rather than a silent gap.
[locations.agent-config]
path = "agent-config"
registers = ["issue"]

[walk]
skip-dirs = []
# PLANTED: `notes/gone.md` is not there. A declared path naming a file that does not exist is
# the stale row this check reports — silent otherwise, and inherited by whatever is created there.
skip-files = ["notes/gone.md"]
exclude = []
