# WHAT THIS MOCK EXERCISES, for the core binary: detection. Its documents are wrong on purpose,
# one planted defect per core check of the last phase, and a test asserts the findings
# themselves rather than merely that something failed. Every core check owes a row in
# `PLANTED` in `path@core@tests/mock_projects.rs`, so a new defect goes here and its count
# goes there.

[project]
name = "planted"
# One component below the root, carrying every document but one.
components = ["parts/widget"]

# A location carrying its issue directory; the one whose directory is not there is planted
# in the `unsound` project.
[locations.agent-config]
path = "agent-config"
registers = ["issue"]

[walk]
# Not a git repository, so there is no `.git` to skip and none is declared.
skip-dirs = []
skip-files = []
exclude = []
