# The workspace: the checker's crate, the crate that carries the agent skills it installs, the gates
# library, and the maintenance tool. No directory is named after the project, per
# `design@knowledge-architect@no-directory-named-after-the-project`.

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/agent-skills",
    "crates/gates",
    "tools/xtask",
]

# One version for every crate, so the installed skills always match the checker that installed
# them, per `design@knowledge-architect@version-lockstep`.
[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tellurium-monoxide/knowledge-architect"
keywords = ["agentic", "software-design", "documentation", "design-decisions", "ai-agents"]
