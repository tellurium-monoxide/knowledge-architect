# What this project declares must stay conformant, and what is exempt from it.
#
# This file is the manifest the checker reads, and its presence is what makes a directory a
# project root: the checker walks up from the working directory looking for this name and refuses
# to run without it. Nothing about this repository is compiled into the checker, per
# `design@core@nothing-of-a-project-is-compiled-in`.
#
# The walk parses `.md` and `.rs` and nothing else, so no reference in this file is checked. A
# comment here names a decision in the reference grammar, `<kind>@<anchor>@<id>`, and writes a
# path relative to this file's own directory.

# The components. The project root is a component too, named by `name`; every other one is named
# by the basename of its directory, so a crate directory is named by its role and never by its
# package: a directory named `knowledge-architect` would collide with the root's name.
[project]
name = "knowledge-architect"
# The checker this repository runs is the one it builds, so its version is the tree's own: the
# value "self", which a binary built from inside this tree confirms and any other refuses.
checker-version = "self"
# The command this repository runs the checker by: the cargo alias that builds it from the
# checkout. It is printed in messages and generated headers, per `design@core@declared-command`.
command = "cargo klarch"
components = [
    "crates/core",
    "crates/agent-skills",
    "crates/gates",
    "tools/xtask",
]

# This repository's own agent configuration carries an issue register, for defects of the
# configuration itself.
[locations.agent-config]
path = ".claude"
registers = ["issue"]

[walk]

# Directories and files skipped by project-relative path. Every row is checked to exist.
skip-dirs = []
#
# The copies of the root changelog that each published crate ships, per
# `design@knowledge-architect@the-changelog-ships-in-every-crate`. Each is byte-identical to the root
# CHANGELOG.md, which is checked, and a test in tools/xtask fails while one differs.
skip-files = [
    "crates/agent-skills/CHANGELOG.md",
    "crates/core/CHANGELOG.md",
    "crates/gates/CHANGELOG.md",
]

# Paths skipped by location, each one another project rather than a part of this one.
#
# The core's mock projects are complete projects of their own: their documents are fixtures, and a
# checker that read them would report a fixture's planted defect as a defect of this repository.
exclude = [
    "crates/core/tests/projects",
    # The text this repository ships to other projects. It names no path of this repository, so
    # its illustrations would be reported as paths here; the installed copies under .claude are
    # out of the walk for the same reason, by construction. The row stands until a mechanical
    # check of shipped text exists: issue@agent-skills@shipped-text-is-reference-free-mechanically.
    "crates/agent-skills/content",
]

# GitHub's rebase merge gives a branch's commits new SHAs, so a message or a document of the
# branch that cites one of them by SHA would name nothing once it merges, per
# `design@core@branch-shas-are-refused`.
[commits]
refuse-branch-shas = true
